<style>

* { box-sizing: border-box; }

<script type="module">
/* ============================================================================
 * Core — 計測・統計の純粋関数群（DOM・Three.js に依存しない）
 * 時刻の単位はすべて ms。入力誤差 E = T − H（T：回避入力、H：攻撃接触）。
 * モデル：攻撃ごとに独立に E ~ N(μ, σ²)。攻撃間でパラメータを共有・プールしない。
 * このブロックは Node からも読み込んで自動テストする（tests/run-core-tests.mjs）。
 * ========================================================================== */
const Core = (() => {
'use strict';

const LN_SQRT2PI = 0.5 * Math.log(2 * Math.PI);
const SQRT2PI = Math.sqrt(2 * Math.PI);

/* ---------------------------------------------------------------- 乱数 --- */
function hashSeed(str) {
  str = String(str);
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  h = Math.imul(h ^ (h >>> 16), 2246822507);
  h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^ (h >>> 16)) >>> 0;
}

/** 再現可能な乱数（sfc32、シードは文字列または整数） */
function makeRng(seed) {
  let s = typeof seed === 'number' ? seed >>> 0 : hashSeed(seed);
  let a = s ^ 0x9e3779b9, b = hashSeed('b' + s), c = hashSeed('c' + s), d = s | 1;
  const next = () => {
    a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
    let t = (a + b) | 0;
    a = b ^ (b >>> 9);
    b = (c + (c << 3)) | 0;
    c = (c << 21) | (c >>> 11);
    d = (d + 1) | 0;
    t = (t + d) | 0;
    c = (c + t) | 0;
    return (t >>> 0) / 4294967296;
  };
  for (let i = 0; i < 16; i++) next();
  let spare = null;
  return {
    random: next,
    uniform: (lo, hi) => lo + (hi - lo) * next(),
    int: (n) => Math.floor(next() * n),
    openUnit() { let u; do { u = next(); } while (u <= 0); return u; },
    normal() {
      if (spare !== null) { const v = spare; spare = null; return v; }
      let u, v, q;
      do { u = 2 * next() - 1; v = 2 * next() - 1; q = u * u + v * v; } while (q >= 1 || q === 0);
      const m = Math.sqrt(-2 * Math.log(q) / q);
      spare = v * m;
      return u * m;
    },
  };
}

function shuffleInPlace(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = rng.int(i + 1);
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

/* ---------------------------------------------------------- 正規分布 --- */
/** 標準正規の下側確率 Φ(x)。Hart(1968)/West(2005) の倍精度近似（相対誤差 ~1e-15）。 */
function normCdf(x) {
  if (Number.isNaN(x)) return NaN;
  const z = Math.abs(x);
  let c;
  if (z > 37) c = 0;
  else {
    const e = Math.exp(-z * z / 2);
    if (z >= 3) {
      // 裾は Mills 比の連分数（後ろから評価）で相対精度を確保
      let f = z;
      for (let k = 120; k >= 1; k--) f = z + k / f;
      c = e / f / SQRT2PI;
    } else {
      let b = 3.52624965998911e-02 * z + 0.700383064443688;
      b = b * z + 6.37396220353165; b = b * z + 33.912866078383; b = b * z + 112.079291497871;
      b = b * z + 221.213596169931; b = b * z + 220.206867912376;
      c = e * b;
      b = 8.83883476483184e-02 * z + 1.75566716318264;
      b = b * z + 16.064177579207; b = b * z + 86.7807322029461; b = b * z + 296.564248779674;
      b = b * z + 637.333633378831; b = b * z + 793.826512519948; b = b * z + 440.413735824752;
      c = c / b;
    }
  }
  return x > 0 ? 1 - c : c;
}
const normSf = (x) => normCdf(-x);
const normPdf = (x) => Math.exp(-0.5 * x * x) / SQRT2PI;
const logNormPdf = (x) => -0.5 * x * x - LN_SQRT2PI;
/** log Φ(x)（下側裾でも安定） */
function logNormCdf(x) {
  if (x > -30) return Math.log(normCdf(x));
  const x2 = x * x;
  return -0.5 * x2 - Math.log(-x) - LN_SQRT2PI + Math.log1p(-1 / x2 + 3 / (x2 * x2) - 15 / (x2 * x2 * x2));
}
const logNormSf = (x) => logNormCdf(-x);

/** 標準正規の分位点（Acklam 近似 + Halley 補正1回） */
function normQuantile(p) {
  if (!(p > 0 && p < 1)) return p === 0 ? -Infinity : p === 1 ? Infinity : NaN;
  const a = [-3.969683028665376e+01, 2.209460984245205e+02, -2.759285104469687e+02, 1.383577518672690e+02, -3.066479806614716e+01, 2.506628277459239e+00];
  const b = [-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02, 6.680131188771972e+01, -1.328068155288572e+01];
  const c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00, -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00];
  const d = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00, 3.754408661907416e+00];
  const pl = 0.02425;
  let x;

      let remaining = Object.fromEntries(ATTACKS.map((a) => [a, perAttack]));
      while (ATTACKS.some((a) => remaining[a] > 0)) {
        const block = [];
        for (const a of ATTACKS) { const k = Math.min(blockPer, remaining[a]); for (let i = 0; i < k; i++) block.push(a); remaining[a] -= k; }
        for (let tries = 0; tries < 200; tries++) { // 3 連続以上を避ける
          shuffleInPlace(block, rng);
          const joined = out.slice(-2).concat(block);
          let ok = true; for (let i = 2; i < joined.length; i++) if (joined[i] === joined[i - 1] && joined[i] === joined[i - 2]) { ok = false; break; }
          if (ok) break;
        }
        out.push(block);
      }
      return out;
    };
    const perBlock = Math.max(1, Math.round(cfg.blockSize / ATTACKS.length));
    const counter = Object.fromEntries(ATTACKS.map((a) => [a, 0]));
    const pracBlocks = cfg.mixedPractice > 0 ? seq(Math.ceil(cfg.mixedPractice / ATTACKS.length), Math.ceil(cfg.mixedPractice / ATTACKS.length)) : [];
    const mainBlocks = seq(cfg.mixedPerAttack, perBlock);
    const allP = pracBlocks.flat().slice(0, cfg.mixedPractice), allM = mainBlocks.flat();
    const fps = fpOf(allP.length + allM.length);
    let k = 0;
    allP.forEach((a) => { counter[a]++; push(a, true, 0, counter[a], fps[k++]); });
    for (const a of ATTACKS) counter[a] = 0;
    mainBlocks.forEach((blk, b) => blk.forEach((a) => { counter[a]++; push(a, false, b + 1, counter[a], fps[k++]); }));
  }
  return { queue };
}

/* ------------------------------------------------------------ 試行ランナー --- */
/**
 * 1 試行の状態機械。時刻はすべて performance.now() 系の同一時計（ms）。
 * S：試行開始＝観測開始（入力受付開始）。W：予兆（予備動作）を初めて描画したフレーム。H = W + lead。
 * obsEnd = H + obsAfter（既定 1000 ms）まで入力を受け付ける。
 */
function createTrialRunner(cfg) {
  const st = cfg.settings, item = cfg.item;
  const timing = attackTiming(item.attack, st.attacks[item.attack]);
  const r = { phase: 'init', S: null, Wsched: null, W: null, H: null, obsEnd: null, impactFrame: null, firstInput: null, ignored: 0, frames: [], lastTs: null, aborted: null, done: false };
  function start(ts) { r.phase = 'ready'; r.S = ts; r.lastTs = ts; r.Wsched = ts + item.foreperiod_ms; }
  function frame(ts) {
    if (r.done || r.aborted || r.phase === 'init') return;
    const dt = r.lastTs !== null ? ts - r.lastTs : null;
    if (dt > 0) r.frames.push(dt);
    r.lastTs = ts;
    if (r.phase === 'ready' && ts >= r.Wsched) {
      r.W = ts; r.H = r.W + timing.lead; r.obsEnd = r.H + st.obsAfter; r.phase = 'attack';
    }
    if (r.phase === 'attack' && ts >= r.H) { r.impactFrame = ts; r.phase = 'post'; }
    if (r.phase === 'post' && ts >= r.obsEnd) { r.phase = 'done'; r.done = true; }
  }
  function input(info) {
    if (r.done || r.aborted || r.phase === 'init') return false;
    if (r.firstInput) { r.ignored++; return false; }
    r.firstInput = info; return true;
  }
  function abort(reason, ts) { if (!r.done && !r.aborted) r.aborted = { reason, ts }; }
  function view() {
    return { attack: item.attack, phase: r.phase, W: r.W, H: r.H, timing, inputAt: r.firstInput ? r.firstInput.handlerTs : null, impactAt: r.impactFrame };
  }
  function result(extra = {}) {
    const toRel = cfg.toRel || ((t) => t);
    const rel = (t) => (t === null || t === undefined ? null : toRel(t));
    const fi = r.firstInput;
    const T = fi && r.obsEnd !== null && fi.time <= r.obsEnd ? fi.time : (fi && r.obsEnd === null ? fi.time : null);
    const aborted = !!r.aborted || !r.done;
    const e = !aborted && T !== null && r.H !== null ? T - r.H : null;
    const fs = frameStats(r.frames);
    const frameDrop = r.frames.some((x) => x > Math.max(50, 3 * (fs.median || 16.7)));
    const reasons = [];
    if (aborted) reasons.push(r.aborted ? r.aborted.reason : 'incomplete');
    if (item.is_practice) reasons.push('practice');
    if (extra.deviceMismatch) reasons.push('device_mismatch');
    if (frameDrop && st.excludeFrameDrops) reasons.push('frame_drop');
    return {
      trial_id: item.trial_id, attack_type: item.attack, measurement_mode: extra.mode || null,
      block_index: item.block_index, trial_index: item.index_in_attack, is_practice: item.is_practice,
      valid_for_fit: reasons.length === 0, invalid_reason: reasons.join('|'), status: aborted ? 'aborted' : 'completed',
      observation_start_ms: rel(r.S),
      attack_warning_scheduled_ms: rel(r.Wsched), attack_warning_time_ms: rel(r.W),
      attack_impact_time_ms: rel(r.H), impact_frame_time_ms: rel(r.impactFrame),
      input_time_ms: !aborted && T !== null ? rel(T) : null,
      input_event_timestamp_ms: fi && fi.eventTs !== null ? rel(fi.eventTs) : null,
      input_handler_timestamp_ms: fi ? rel(fi.handlerTs) : null, input_time_source: fi ? fi.source : null,
      input_device: fi ? fi.device : null, input_code: fi ? fi.code : null,
      input_after_observation: !!(fi && T === null),
      input_error_ms: e,
      pre_warning_input: e !== null && r.W !== null && T < r.W,
      outcome: aborted ? 'aborted' : classify(e, st.justWindow, st.invincibleWindow),
      is_censored: !aborted && T === null,
      observation_end_ms: rel(r.obsEnd),
      warning_lead_ms: r.H !== null ? r.H - r.W : null, foreperiod_ms: item.foreperiod_ms,
      warning_frame_delay_ms: r.W !== null ? r.W - r.Wsched : null, impact_frame_delay_ms: r.impactFrame !== null ? r.impactFrame - r.H : null,
      just_window_ms: st.justWindow, invincible_window_ms: st.invincibleWindow,
      attack_parameter_json: JSON.stringify(timing.params),
      estimated_fps: fs.fps, frame_mean_ms: fs.mean, frame_sd_ms: fs.sd, frame_p95_ms: fs.p95, frame_max_ms: fs.max,
      frame_drop_warning: frameDrop, ignored_input_count: r.ignored,
      ...extra.fields,
    };
  }
  return { start, frame, input, abort, view, result, state: r, timing };
}

/* -------------------------------------------------------- 解析用の行 --- */
/** 攻撃 1 種類の推定用データ。a = 観測開始 − H（左側の切断）、c = 観測終了 − H（右打ち切り）。 */
function rowsFor(trials, attack) {
  return trials.filter((t) => t.attack_type === attack && t.status === 'completed' && t.valid_for_fit)
    .map((t) => ({ e: t.is_censored ? null : t.input_error_ms, a: t.observation_start_ms - t.attack_impact_time_ms, c: t.observation_end_ms - t.attack_impact_time_ms, id: t.trial_id }));
}

/* ------------------------------------------------------------ 記述統計 --- */
function skewness(a) {
  const n = a.length; if (n < 3) return NaN;
  const m = mean(a); let m2 = 0, m3 = 0; for (const v of a) { m2 += (v - m) ** 2; m3 += (v - m) ** 3; }
  m2 /= n; m3 /= n; const g1 = m3 / Math.pow(m2, 1.5);
  return Math.sqrt(n * (n - 1)) / (n - 2) * g1; // 標本補正（Fisher–Pearson）
}
function excessKurtosis(a) {
  const n = a.length; if (n < 4) return NaN;
  const m = mean(a); let m2 = 0, m4 = 0; for (const v of a) { m2 += (v - m) ** 2; m4 += (v - m) ** 4; }
  m2 /= n; m4 /= n; const g2 = m4 / (m2 * m2) - 3;
  return ((n - 1) / ((n - 2) * (n - 3))) * ((n + 1) * g2 + 6);
}
/** 外れ値：Tukey の柵（四分位範囲の 1.5 倍）の外 */
function outlierInfo(a) {
  const s = a.slice().sort((x, y) => x - y);
  const q1 = quantileSorted(s, 0.25), q3 = quantileSorted(s, 0.75), iqr = q3 - q1;
  const lo = q1 - 1.5 * iqr, hi = q3 + 1.5 * iqr;
  const k = s.filter((v) => v < lo || v > hi).length;
  return { lo, hi, count: k, fraction: s.length ? k / s.length : NaN };
}
/** 正規 Q-Q：観測値（昇順）と理論分位点（Blom 位置） */
function qqPoints(a, mu, sigma) {
  const s = a.slice().sort((x, y) => x - y), n = s.length;
  return s.map((v, i) => [mu + sigma * normQuantile((i + 1 - 0.375) / (n + 0.25)), v]);
}

/* ------------------------------------------------------- 正規推定（全体） --- */
/**
 * 1 種類の攻撃について：
 *  - simple：入力が観測された試行だけの標本平均・最尤 SD（n で割る）と不偏 SD
 *  - mle：観測開始で左側切断、観測終了で右打ち切りを入れた最尤推定
 *    観測：f(T)/(1−F(A))、無入力：(1−F(C))/(1−F(A))
 */
function fitNormalAttack(rows) {
  const obs = rows.filter((r) => r.e !== null).map((r) => r.e);
  const n = obs.length;
  const m = mean(obs);
  const simple = n ? { mu: m, sigma: Math.sqrt(obs.reduce((s, v) => s + (v - m) ** 2, 0) / n), sdUnbiased: sd(obs), n } : null;
  const mle = rows.length ? fitPredictive(rows) : { ok: false, warnings: ['データがありません。'] };
  const d = n ? describe(obs) : null;
  return {
    n: rows.length, nObs: n, nCens: rows.length - n, simple, mle,
    descriptive: d ? { ...d, skewness: skewness(obs), excessKurtosis: excessKurtosis(obs), outliers: outlierInfo(obs) } : null,
  };
}

/** 非切断の正規分布での結果確率（late_hit は「接触より後」全体） */
function normalOutcomeProbs(mu, sigma, J, D) {
  const F = (x) => normCdf((x - mu) / sigma);
  return { early_hit: F(-D), normal: Math.max(0, F(-J) - F(-D)), just: Math.max(0, F(0) - F(-J)), late_hit: 1 - F(0) };
}
/** P_Just = Φ(−μ/σ) − Φ((−J−μ)/σ) */
function pJust(mu, sigma, J) { return normCdf(-mu / sigma) - normCdf((-J - mu) / sigma); }
/** 観測可能な試行の確率（観測開始 a で切断、観測終了 c で打ち切り）。試行ごとの a, c で平均 */
function conditionalOutcomeProbs(mu, sigma, rows, J, D) {
  const acc = { early_hit: 0, normal: 0, just: 0, late_hit: 0, no_input: 0 };
  for (const r of rows) {
    const P = makePred(mu, sigma, r.a);
    const pr = outcomeProbs((e) => predCdf(e, P), J, D, r.c);
    for (const k in acc) acc[k] += pr[k];
  }
  for (const k in acc) acc[k] /= rows.length || 1;
  return acc;
}

/* ------------------------------------------------------- 正規乱数の検査 --- */
function normalRngCheck(rng, n) {
  let s = 0, s2 = 0; const xs = new Float64Array(n);
  for (let i = 0; i < n; i++) { const z = rng.normal(); xs[i] = z; s += z; s2 += z * z; }
  const m = s / n, v = s2 / n - m * m;
  xs.sort();
  let D = 0; for (let i = 0; i < n; i += 3) { const F = normCdf(xs[i]); D = Math.max(D, Math.abs((i + 1) / n - F), Math.abs(i / n - F)); }
  return { mean: m, variance: v, ks: D, ksCrit01: 1.63 / Math.sqrt(n) };
}

}
/** 標準の固定タイミング条件を区別するキー（攻撃種類＋その攻撃のタイミング設定） */
function timingKey(attack, params) { return attack + ':' + JSON.stringify(params); }

/* ------------------------------------------------------- 自動テスト --- */
function runCoreTests() {
  const out = [];
  const T = (name, fn) => {
    try { const r = fn(); out.push({ name, pass: r === true || !!(r && r.pass), detail: r && r.detail ? r.detail : '' }); }
    catch (err) { out.push({ name, pass: false, detail: 'exception: ' + (err && err.message) }); }
  };
  const close = (a, b, tol) => Math.abs(a - b) <= tol;
  const rng = makeRng('tests');
  const settings = { attacks: JSON.parse(JSON.stringify(DEFAULT_ATTACK_PARAMS)), obsAfter: 1000, justWindow: 176, invincibleWindow: 400, excludeFrameDrops: false };

  T('1. 正規乱数：平均0・分散1・KS', () => {
    const c = normalRngCheck(makeRng('rng-check'), 200000);
    return { pass: Math.abs(c.mean) < 0.01 && Math.abs(c.variance - 1) < 0.015 && c.ks < c.ksCrit01, detail: `mean ${c.mean.toFixed(4)} var ${c.variance.toFixed(4)} KS ${c.ks.toExponential(2)} (<${c.ksCrit01.toExponential(2)})` };
  });
  T('正規CDF・分位点の精度', () => {
    const cases = [[0, 0.5], [1.96, 0.9750021048517795], [-3, 0.0013498980316301], [-6, 9.865876450376946e-10]];
    const err = Math.max(...cases.map(([x, v]) => Math.abs(normCdf(x) - v) / v));
    let q = 0; for (const p of [1e-6, 0.01, 0.3, 0.5, 0.9, 0.999]) q = Math.max(q, Math.abs(normCdf(normQuantile(p)) - p) / Math.min(p, 1 - p));
    return { pass: err < 1e-12 && q < 1e-9, detail: `CDF ${err.toExponential(1)}, 分位点 ${q.toExponential(1)}` };
  });
  T('2. 正規分布の最尤推定（打ち切り・切断なし）＝標本平均と n で割った SD', () => {
    const xs = Array.from({ length: 300 }, () => -90 + 45 * rng.normal());
    const rows = xs.map((e) => ({ e, a: -Infinity, c: Infinity }));
    const f = fitNormalAttack(rows);
    const m = mean(xs), s = Math.sqrt(xs.reduce((a, v) => a + (v - m) ** 2, 0) / xs.length);

  });

  });

  });
  T('9. 練習試行が標準の推定に混ざらない', () => {
    const item = { trial_id: 'roar-P1', attack: 'roar', is_practice: true, block_index: 0, index_in_attack: 1, foreperiod_ms: 900 };
    const tr = createTrialRunner({ item, settings }); let t = 0; tr.start(t);
    while (!tr.state.done) { t += 16.7; if (tr.state.H && !tr.state.firstInput && t > tr.state.H - 80) tr.input({ time: t, eventTs: t, handlerTs: t, device: 'keyboard', code: 'Space', source: 'event' }); tr.frame(t); }

  });

      <tr><td>σ（単純：n で割る最尤 SD／n−1 の不偏 SD）</td><td>${fmt(s.sigma, 2)} ／ ${fmt(s.sdUnbiased, 2)} ms</td><td>—</td><td>${ciTxt(g.ci && g.ci.ssd, 2)}</td></tr>
      <tr><td>Just 成功率（モデル・非切断）</td><td>${pct(Core.pJust(m.mu, m.sigma, J))}</td><td>—</td><td>${ciTxt(bootJ, 1, pct)}</td></tr>
      <tr><td>Just 成功率（実測）</td><td>${pct(obsJ / N)}（${obsJ}/${N}）</td><td>—</td><td>${ciTxt(wJ, 1, pct)}（Wilson）</td></tr></table></div>
    <p class="muted">${m.truncation.negligible ? '観測開始による切断の影響は無視できる大きさです（最大 ' + (100 * m.truncation.maxProb).toFixed(3) + '%）。' : '観測開始による切断（最大 ' + (100 * m.truncation.maxProb).toFixed(1) + '%）を尤度に反映しています。'}σ が小さいほど入力タイミングが安定しています。</p>
    <h3>結果の確率</h3><div class="scroll-x"><table class="tbl"><tr><th></th><th>実測（割合）</th><th>モデル：非切断の正規分布</th><th>モデル：観測可能な試行（切断・打ち切りを条件付け）</th></tr>
      ${[['just', 'ジャスト回避'], ['normal', '通常回避'], ['early_hit', '早すぎ被弾'], ['late_hit', '遅すぎ被弾'], ['no_input', '無入力（観測終了まで）']].map(([k, l]) => `<tr><td>${l}</td><td>${pct(obsCount(k) / N)}</td><td>${k === 'no_input' ? '—（遅すぎ被弾に含む）' : pct(P[k])}</td><td>${pct(Pc[k])}</td></tr>`).join('')}</table></div>

      <tr><td>${fmt(d.mean, 1)}</td><td>${fmt(d.p50, 1)}</td><td>${fmt(d.sd, 1)}</td><td>${fmt(d.skewness, 2)}</td><td>${fmt(d.excessKurtosis, 2)}</td><td>${d.outliers.count}（${pct(d.outliers.fraction)}）</td><td>${fmt(d.min, 0)}〜${fmt(d.max, 0)}</td></tr></table></div>

  drawChart($('#ch-cdf'), { x: [lo, hi], y: [0, 1], xLabel: '入力誤差 E（ms）', yLabel: 'CDF（無入力は +∞）', bands, series: [{ type: 'step', pts: ecdfPts(g.rows.map((r) => r.e)), color: col }, { type: 'line', pts: cdf, color: '#fff', dash: [5, 4] }], legend: [{ label: '経験 CDF', color: col }, { label: '正規 CDF', color: '#fff', dash: [5, 4] }] });

  const jpts = []; for (let j = 50; j <= 300; j += 2) jpts.push([j, Core.pJust(m.mu, m.sigma, j)]);
  drawChart($('#ch-J'), { x: [50, 300], y: [0, 1], xLabel: 'ジャスト受付時間 J（ms）', yLabel: '理論 Just 成功率', yFmt: (v) => (100 * v).toFixed(0) + '%', vlines: [110, 176, 181.5, 187].map((x) => ({ x, color: x === J ? '#fff' : 'rgba(200,220,255,0.35)', label: x === J ? 'J' : '' })), series: [{ type: 'line', pts: jpts, color: col, width: 2.2 }] });
  const mlo = -J - 3 * m.sigma, mhi = 3 * m.sigma, mpts = []; for (let x = mlo; x <= mhi; x += 1) mpts.push([x, Core.pJust(x, m.sigma, J)]);
  drawChart($('#ch-mu'), { x: [mlo, mhi], y: [0, 1], xLabel: '平均入力誤差 μ（ms、σ 一定）', yLabel: '理論 Just 成功率', yFmt: (v) => (100 * v).toFixed(0) + '%', vlines: [{ x: m.mu, color: col, label: '現在' }, { x: muOpt, color: '#fff', label: '最適 −J/2' }], series: [{ type: 'line', pts: mpts, color: col, width: 2.2 }] });
}

/** SAOFD シミュレーション向けのパラメータ JSON（未測定の攻撃は null） */
function paramsExport(a) {
  const dist = {}, meta = {};

  for (const at of AT) {
    const key = a.defaultGroup[at]; const g = key && a.groups.find((x) => x.key === key);
    if (!g || !g.fit.mle.ok) { dist[at] = null; meta[at] = null; continue; }
    const m = g.fit.mle;
    dist[at] = { mu_ms: m.mu, sigma_ms: m.sigma };
    meta[at] = {
      valid_trials: g.counts.valid, observed_inputs: g.counts.observed, practice_trials: g.counts.practice, no_input_trials: g.counts.censored, excluded_trials: g.counts.excluded, aborted_trials: g.counts.aborted,
      ci95: { mu_ms: g.ci ? g.ci.mu : null, sigma_ms: g.ci ? g.ci.sigma : null, bootstrap_replicates: g.ci ? g.ci.nBoot : 0 },
      simple_estimate: { mu_ms: g.fit.simple.mu, sigma_ms: g.fit.simple.sigma },
      estimator: 'maximum likelihood with left truncation at observation start and right censoring at observation end',
      normality: { ks: m.gof ? m.gof.ks : null, p_ks: m.gof ? m.gof.pKS ?? null : null, anderson_darling: m.gof ? m.gof.ad : null, p_ad: m.gof ? m.gof.pAD ?? null : null, skewness: g.fit.descriptive.skewness, excess_kurtosis: g.fit.descriptive.excessKurtosis, outlier_fraction: g.fit.descriptive.outliers.fraction, warning: (m.gof && m.gof.pAD < 0.05) || Math.abs(g.fit.descriptive.skewness) > 1 },
      measurement_mode: g.mode, attack_timing: JSON.parse(g.params || 'null'), input_devices: g.devices, sessions: g.sessions,
      derived: { note: '推定パラメータから計算した値（非切断の正規分布）', just_window_ms: J, invincible_window_ms: D, ...Object.fromEntries(Object.entries(Core.normalOutcomeProbs(m.mu, m.sigma, J, D)).map(([k, v]) => ['p_' + k, v])), mu_optimal_ms: -J / 2 },
      other_groups: a.groups.filter((x) => x.attack === at && x.key !== key).map((x) => ({ mode: x.mode, attack_timing: JSON.parse(x.params || 'null'), valid_trials: x.counts.valid })),

  };
}

/* ------------------------------------------------- 自己診断（E2E・コンソール用） --- */
async function runAllTests() {
  const res = Core.runCoreTests();
  const T = async (name, fn) => { try { const r = await fn(); res.push({ name, pass: !!(r === true || (r && r.pass)), detail: r && r.detail ? r.detail : '' }); } catch (e) { res.push({ name, pass: false, detail: e.message }); } };
  await T('10. 保存した JSON を再読み込みして同じ解析結果を再現', async () => {
    const st = mergeSettings(DEFAULT_SETTINGS, null), rng = Core.makeRng('roundtrip');
    const sess = createSession(st, 'mixed', 'slam'); sess.queue = sess.queue.slice(0, 84);
    let tt = 1000;
    for (const item of sess.queue) {
      const tr = Core.createTrialRunner({ item, settings: st, toRel: (t) => t }); tr.start(tt); let k = 0; const target = -90 + 40 * rng.normal();
      while (!tr.state.done && k++ < 100000) { tt += 16.7; if (tr.state.H !== null && !tr.state.firstInput && tt >= tr.state.H + target) tr.input({ time: tr.state.H + target, eventTs: tr.state.H + target, handlerTs: tt, device: 'keyboard', code: 'Space', source: 'event' }); tr.frame(tt); }
      sess.trials.push(tr.result({ mode: 'mixed', fields: { session_id: sess.id, timing_key: Core.timingKey(item.attack, st.attacks[item.attack]) } }));
      tt += 500;
    }
    sess.status = 'complete';
    const a1 = await runAnalysis([sess], { bootstrapN: 0, J: 176 }, () => {});
    const text = JSON.stringify(sessionExport(sess));
    const s2 = importSessionJSON(JSON.parse(text));
    if (!Store.saveSession(s2)) return { pass: false, detail: '保存に失敗' };
    const s3 = Store.loadSession(s2.id); Store.deleteSession(s2.id);
    const a2 = await runAnalysis([s3], { bootstrapN: 0, J: 176 }, () => {});
    const diffs = a1.groups.map((g) => { const h = a2.groups.find((x) => x.key === g.key); return h && g.fit.mle.ok ? Math.max(Math.abs(g.fit.mle.mu - h.fit.mle.mu), Math.abs(g.fit.mle.sigma - h.fit.mle.sigma)) : (g.fit.mle.ok ? Infinity : 0); });
    return { pass: a1.groups.length === AT.length && a2.groups.length === AT.length && Math.max(...diffs) === 0, detail: `${AT.length} 攻撃 × 各 ${a1.groups[0].counts.valid} 試行、最大差 ${Math.max(...diffs)}` };
  });
  await T('ローカル保存：書き込み → 読み込み', () => { const id = '__selftest__'; const s = { id, trials: [{ a: 1.25, b: null }], queue: [], status: 'complete', created_at: new Date().toISOString() }; if (!Store.saveSession(s)) return false; const r = Store.loadSession(id); Store.deleteSession(id); return r && r.trials[0].a === 1.25 && r.trials[0].b === null; });
  await T('入力イベント時刻が performance.now() と同じ時計', () => { const ev = new Event('x'), now = performance.now(), n = normalizeEventTs(ev.timeStamp, now); return { pass: n !== null && Math.abs(n - now) < 50, detail: `event ${fmt(ev.timeStamp, 3)} / now ${fmt(now, 3)}` }; });
  await T('performance.now() の分解能（目安）', () => { let d = Infinity, prev = performance.now(); for (let i = 0; i < 20000; i++) { const t = performance.now(); if (t > prev) { d = Math.min(d, t - prev); prev = t; } } return { pass: d <= 1, detail: `最小刻み ≈ ${d.toFixed(4)} ms` }; });
  window.__testResults = res;
  return res;
}

/* ------------------------------------------------------------ 起動 --- */
function bindUI() {
  $$('.tab').forEach((t) => (t.onclick = () => switchTab(t.dataset.tab)));
  document.addEventListener('click', (e) => {
    const sa = e.target.closest('[data-statsattack]'); if (sa) { App.statsAttack = sa.dataset.statsattack; renderStats(); return; }
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act;
    if (act === 'continue') continueSession();
    else if (act === 'goto-stats') switchTab('stats');
    else if (act === 'settings-reset') askConfirm('設定を既定値に戻しますか？', '戻す').then((ok) => { if (ok) { App.settings = clone(DEFAULT_SETTINGS); Store.saveSettings(App.settings); renderSettings(); syncModeUI(); } });
    else if (b.dataset.id) dataAction(act, b.dataset.id);
  });
  $('#btn-start').onclick = startNewSession;
  $('#btn-continue').onclick = continueSession;
  $('#btn-pause').onclick = () => pauseSession('user_pause');
  $('#btn-end').onclick = endSession;
  $('#m-mode').onchange = () => { App.settings.mode = $('#m-mode').value; Store.saveSettings(App.settings); syncModeUI(); };
  $('#m-attack').onchange = () => { App.settings.attack = $('#m-attack').value; Store.saveSettings(App.settings); syncModeUI(); };
  $('#st-run').onclick = runAnalysisUI;
  $('#st-J').oninput = () => { if (App.analysis) renderStats(); };
  $$('#st-Jpresets [data-j]').forEach((b) => (b.onclick = () => { $('#st-J').value = b.dataset.j; if (App.analysis) renderStats(); }));
  $('#st-params').onclick = () => { if (!App.analysis) return toast('先に解析を実行してください。', true); download(`saofd_params_${App.analysis.sessionIds.join('+')}.json`, JSON.stringify(paramsExport(App.analysis), null, 2), 'application/json'); };
  $('#st-json').onclick = () => { if (!App.analysis) return toast('先に解析を実行してください。', true); download(`analysis_${App.analysis.sessionIds.join('+')}.json`, JSON.stringify(stripAnalysis(App.analysis), null, 1), 'application/json'); };
  $('#import-file').onchange = (e) => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    const fr = new FileReader();
    fr.onload = () => { try { const s = importSessionJSON(JSON.parse(fr.result)); Store.saveSession(s); renderDataPanel(); toast(`取り込みました：${s.id}（${s.trials.length} 試行）`); } catch (err) { toast('取り込みに失敗：' + err.message, true); } };
    fr.readAsText(f);
  };
  $('#settings-form').addEventListener('change', (e) => { if (e.target.dataset.k && e.target.dataset.k !== 'inputKey') readSetting(e.target); });
  $('#settings-form').addEventListener('click', (e) => {
    const p = e.target.closest('[data-preset]'); if (p) { setK(App.settings, p.dataset.preset, +p.dataset.v); Store.saveSettings(App.settings); renderSettings(); }
    if (e.target.dataset && e.target.dataset.k === 'inputKey') {
      capturingKey = true; e.target.value = '（キーを押してください）';
      const h = (ev) => { ev.preventDefault(); ev.stopPropagation(); capturingKey = false; window.removeEventListener('keydown', h, true); if (ev.code !== 'Escape') App.settings.inputKey = ev.code; Store.saveSettings(App.settings); renderSettings(); };
      window.addEventListener('keydown', h, true);
    }
  });
  bindPointer($('#stage-gl')); bindPointer($('#touch-dodge'));
  window.addEventListener('resize', () => App.scene && App.scene.resize());
  if ('ResizeObserver' in window) new ResizeObserver(() => App.scene && App.scene.resize()).observe($('#stage-gl'));
}
// 測定モード・攻撃の選択欄を、ブラウザに保存された設定と常に一致させる
function syncModeUI() {
  const s = App.settings;
  if (!MODE_LABEL[s.mode]) s.mode = DEFAULT_SETTINGS.mode;
  if (!AT.includes(s.attack)) s.attack = DEFAULT_SETTINGS.attack;
  $('#m-mode').value = s.mode; $('#m-attack').value = s.attack;
  $('#m-attack-row').hidden = $('#m-attack-row-label').hidden = s.mode !== 'individual';
  App.previewAttack = s.attack;
}
async function boot() {
  App.settings = mergeSettings(DEFAULT_SETTINGS, Store.settings());
  $('#m-attack').innerHTML = AT.map((a) => `<option value="${a}">${AL[a]}</option>`).join('');
  syncModeUI();
  bindUI();
  if (!Store.available()) toast('ローカル保存が利用できません。測定データは再読み込みで失われます。', true);
  updateHud(true); refreshButtons();
  requestAnimationFrame(frameLoop);
  sceneKey = JSON.stringify([App.settings.quality, App.settings.effects]);
  await initScene();
  const act = Store.active(), s = act && Store.loadSession(act);
  if (s && s.status === 'active') resumeSession(s.id);
  else setOverlay(`<div class="ov-title">${APP_NAME}</div><div class="ov-text">${AT.map((a) => AL[a]).join('・')}の ${AT.length} 種類の攻撃に対して、ジャスト回避の入力タイミング誤差を測ります。攻撃ごとに正規分布 N(μ, σ²) を独立に推定します。</div>`);
  window.__app = App; window.runAllTests = runAllTests;
}
boot();

</script>
